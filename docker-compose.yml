services:
  dwr-eo-toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dwr-eo-toolkit-dev
    
    # Phase 4: API Server
    command: uvicorn dwr_eo_toolkit.api:app --host 0.0.0.0 --port 8000 --reload
    
    ports:
      - "8000:8000"
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED}
    
    volumes:
      - .:/app
      - /app/.venv
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - dwr-network
    
    stdin_open: true
    tty: true

  postgres:
    image: postgres:15-alpine
    container_name: dwr-eo-toolkit-db
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
    
    networks:
      - dwr-network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  dwr-network:
    driver: bridge