services:
  dwr-eo-toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dwr-eo-toolkit-dev
    
    environment:
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-your_token_here}
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: 1
    
    volumes:
      - .:/app                   # Mount entire project for live reload
      - /app/.venv               # Exclude virtual env from host
    
    networks:
      - dwr-network
    
    # Phase 3: Run tests
    command: pytest tests/ -v --cov=src/dwr_eo_toolkit --tb=short
    
    # Phase 4: Change to API
    # command: uvicorn dwr_eo_toolkit.api:app --host 0.0.0.0 --port 8000 --reload
    # ports:
    #   - "8000:8000"
    
    stdin_open: true
    tty: true

