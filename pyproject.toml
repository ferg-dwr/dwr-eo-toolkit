[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwr-eo-toolkit"
version = "0.3.0"
description = "Department of Water Resources Earth Observation Toolkit"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Fernando Emiliano Romero Galvan", email = "fernando.romerogalvan@gmail.com"},
]
license = {text = "MIT"}
[project]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "earthaccess>=0.6.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "apscheduler>=3.10.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

phase4 = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "click>=8.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/ferg-dwr/dwr-eo-toolkit"
Documentation = "https://github.com/ferg-dwr/dwr-eo-toolkit"
Repository = "https://github.com/ferg-dwr/dwr-eo-toolkit.git"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",  # Line too long (we set line-length=100 above)
    "E701",  # Multiple statements on one line
]

[tool.ruff.lint.isort]
known-first-party = ["dwr_eo_toolkit"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once all defs are typed
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.setuptools]
packages = ["dwr_eo_toolkit"]

[tool.setuptools.package-dir]
"" = "src"