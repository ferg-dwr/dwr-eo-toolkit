[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-eo-data"
version = "0.1.0"
description = "NASA Earth Observation Data Access Package"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
license = {text = "MIT"}

dependencies = [
    "requests>=2.28.0",
    "earthaccess>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/your-username/nasa-eo-data"
Documentation = "https://github.com/your-username/nasa-eo-data"
Repository = "https://github.com/your-username/nasa-eo-data.git"

[tool.setuptools]
packages = ["nasa_eo_data"]

[tool.setuptools.package-dir]
"" = "src"