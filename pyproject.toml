[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwr-eo-toolkit"
version = "0.1.0"
description = "Department of Water Resources Earth Observation Toolkit"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Fernando Emiliano Romero Galvan", email = "fernando.romerogalvan@gmail.com"},
]
license = {text = "MIT"}

dependencies = [
    "requests>=2.28.0",
    "earthaccess>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0.0",        # (code formatting)
    "isort>=5.12.0",        # (import sorting)
    "flake8>=6.0.0",        # (linting)
    "mypy>=0.990",
    "apscheduler>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/ferg-dwr/dwr-eo-toolkit"
Documentation = "https://github.com/ferg-dwr/dwr-eo-toolkit"
Repository = "https://github.com/ferg-dwr/dwr-eo-toolkit.git"

[tool.setuptools]
packages = ["dwr_eo_toolkit"]

[tool.setuptools.package-dir]
"" = "src"