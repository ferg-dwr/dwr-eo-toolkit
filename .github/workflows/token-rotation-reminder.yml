name: Token Rotation Reminder
 
on:
  schedule:
    - cron: cron: '0 0 1 1,4,7,10 *' # Jan, Apr, Jul, Oct 1st at midnight UTC
 
jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Create token rotation reminder
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Security] Rotate API tokens',
              body: 'Token rotation reminder:\n\n- NASA Earthdata: https://urs.earthdata.nasa.gov/user_settings/applications\n- Docker Hub: https://hub.docker.com/settings/security\n- Codecov: https://app.codecov.io/account\n\nUpdate GitHub Secrets after creating new tokens.'})