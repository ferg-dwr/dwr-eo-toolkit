name: Tests

# When to run this workflow
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    # Run on Ubuntu Linux in GitHub cloud
    runs-on: ubuntu-latest
    
    # Test on multiple Python versions
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
    # Step 1: Get your code from GitHub
    - uses: actions/checkout@v3
      
    # Step 2: Set up Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    # Step 4: Run tests
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src/nasa_eo_data --cov-report=xml
    
    # Step 5: Upload coverage reports to Codecov (optional)
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      # Don't fail the workflow if codecov upload fails
      continue-on-error: true
