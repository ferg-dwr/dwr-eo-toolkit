name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Test on all supported Python versions (3.8+)
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with Ruff
      run: |
        ruff check src tests
    
    - name: Format check with Ruff
      run: |
        ruff format --check src tests

    - name: Install type stubs for mypy
      run: |
        pip install types-requests

    - name: Type check with MyPy
      run: |
        mypy src/dwr_eo_toolkit
    
    - name: Run all tests with pytest
      run: |
        pytest tests/ -v \
          --cov=src/dwr_eo_toolkit \
          --cov-report=term-missing

    - name: Check Phase 3 coverage (minimum 82%)
      run: |
        pytest tests/test_batch_manager.py tests/test_scheduler.py tests/test_downloads.py \
          -v \
          --cov=src/dwr_eo_toolkit/download_manager \
          --cov=src/dwr_eo_toolkit/core \
          --cov-report=term-missing \
          --cov-fail-under=82

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: dwr-eo-toolkit:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker build -t dwr-eo-toolkit:test .
        docker run --rm dwr-eo-toolkit:test python -c "
          from dwr_eo_toolkit.download_manager import (
            BatchDownloadManager,
            DownloadScheduler,
            DownloadSession
          )
          print('✅ Core imports successful')
        "
