name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Test on all supported Python versions (3.8+)
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with Ruff
      run: |
        ruff check src tests
    
    - name: Format check with Ruff
      run: |
        ruff format --check src tests

    - name: Install type stubs for mypy
      run: |
        pip install types-requests

    - name: Type check with MyPy
      run: |
        mypy src/dwr_eo_toolkit
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v \
          --cov=src/dwr_eo_toolkit \
          --cov-report=xml \
          --cov-report=term-missing

    - name: Check coverage thresholds (per-module, target - 4%)
      run: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET
        import sys
        
        # Parse coverage XML
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        
        # Define minimum coverage by package (current - 4%)
        # These thresholds prevent regressions while allowing healthy refactoring
        thresholds = {
            'dwr_eo_toolkit': 78,                           # 82.0% - 4%
            'dwr_eo_toolkit.providers': 92,                 # 96.5% - 4%
            'dwr_eo_toolkit.download_manager': 85,          # 89.1% - 4%
            'dwr_eo_toolkit.core': 84,                      # 88.9% - 4%
            'dwr_eo_toolkit.filters': 77,                   # 81.8% - 4%
        }
        
        # Extract package coverages from XML
        packages = {}
        for package in root.findall('.//package'):
            pkg_name = package.get('name')
            line_rate = float(package.get('line-rate', 0))
            coverage_pct = line_rate * 100
            packages[pkg_name] = coverage_pct
        
        # Check thresholds
        failed = False
        print("\n" + "="*70)
        print("COVERAGE THRESHOLD CHECK (Per-Module, Current - 4%)")
        print("="*70 + "\n")
        
        for pkg, threshold in thresholds.items():
            actual = packages.get(pkg, 0)
            status = "✅ PASS" if actual >= threshold else "❌ FAIL"
            print(f"{status} | {pkg:<45} {actual:>6.1f}% (min: {threshold}%)")
            if actual < threshold:
                failed = True
        
        print("\n" + "="*70)
        
        if failed:
            print("❌ COVERAGE CHECK FAILED - Some modules below minimum threshold")
            print("   Run: pytest --cov-report=html")
            print("   Then: open htmlcov/index.html")
            sys.exit(1)
        else:
            print("✅ ALL COVERAGE THRESHOLDS PASSED")
            sys.exit(0)
        PYEOF
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false  # Don't fail if Codecov has issues
      continue-on-error: true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: dwr-eo-toolkit:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker build -t dwr-eo-toolkit:test .
        docker run --rm dwr-eo-toolkit:test python -c "
          from dwr_eo_toolkit.download_manager import (
            BatchDownloadManager,
            DownloadScheduler,
            DownloadSession
          )
          print('✅ Core imports successful')
        "

  # Uncomment when Phase 4 database layer is ready:
